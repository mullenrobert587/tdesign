name: Issue Synchronize
jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
    - uses: TDesignOteam/create-report@main
      with:
        wxhook: ${{ secrets.WX_HOOK_URL }}
        token: ${{ secrets.GITHUB_TOKEN  }}
        type: issue
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  issues:
    types:
    - opened
    - reopened
